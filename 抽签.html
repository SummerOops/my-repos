<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>护理技能抽签系统</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }
        body {
            background: #eef3fa;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 2rem;
            padding: 1.8rem 1.5rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 0.2rem;
            color: #1a4d6b;
            text-align: center;
        }
        .sub {
            text-align: center;
            color: #4b6f8c;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #cbdde9;
            display: inline-block;
            width: 100%;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
            color: #1f5980;
            font-size: 0.9rem;
        }
        input, button {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid #caddf0;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #2c7da0;
            box-shadow: 0 0 0 2px rgba(44,125,160,0.2);
        }
        button {
            background: #2c7da0;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 12px;
            font-size: 1rem;
        }
        button:active {
            transform: scale(0.97);
            background: #1d5f7c;
        }
        .result-box {
            background: #e9f3fa;
            border-radius: 2rem;
            padding: 1.2rem;
            text-align: center;
            margin-top: 1.5rem;
        }
        .project-badge {
            font-size: 1.8rem;
            font-weight: 800;
            padding: 12px;
            border-radius: 60px;
            display: inline-block;
            width: 80%;
        }
        .project-xitan { background: #ffe2e2; color: #b12e2e; }
        .project-shuye { background: #e0efff; color: #1f6392; }
        .project-xiyang { background: #e0f4e4; color: #2a6b2f; }
        .project-shengming { background: #fff0dd; color: #c97e0a; }
        .admin-area {
            background: #f9f9fc;
            border: 1px solid #caddf0;
            border-radius: 1.8rem;
            padding: 1rem;
        }
        .admin-header {
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-outline {
            background: white;
            border: 1px solid #2c7da0;
            color: #2c7da0;
            padding: 8px 16px;
            width: auto;
            margin-top: 0;
            font-size: 0.85rem;
        }
        .btn-outline:active {
            background: #eaf3fc;
        }
        .export-btn {
            background: #2c6e49;
            border: none;
            color: white;
        }
        .small-note {
            font-size: 0.7rem;
            color: #7c96ab;
            text-align: center;
            margin-top: 12px;
        }
        .password-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .password-input-group input {
            flex: 1;
            padding: 10px;
        }
        .password-input-group button {
            width: auto;
            padding: 10px 20px;
            margin-top: 0;
        }
        .admin-panel {
            display: none;
            margin-top: 12px;
        }
        .admin-panel.show {
            display: block;
        }
        .status-badge {
            display: inline-block;
            background: #f8d7da;
            color: #721c24;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
        }
        .status-badge.logged {
            background: #d4edda;
            color: #155724;
        }
        .required {
            color: #e74c3c;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 考生抽签卡 -->
    <div class="card">
        <h1>📋 护理技能抽签</h1>
        <div class="sub">扫码填写信息 · 抽取考试项目</div>

        <div class="form-group">
            <label>🏥 科室 <span class="required">*</span></label>
            <input type="text" id="dept" placeholder="请填写所在科室" autocomplete="off">
        </div>
        <div class="form-group">
            <label>👤 姓名 <span class="required">*</span></label>
            <input type="text" id="name" placeholder="真实姓名" autocomplete="off">
        </div>
        <div class="form-group">
            <label>🆔 工号 <span class="required">*</span></label>
            <input type="text" id="jobNo" placeholder="工号/工牌号" autocomplete="off">
        </div>
        <div class="form-group">
            <label>📞 手机号 <span class="required">*</span></label>
            <input type="tel" id="phone" placeholder="11位手机号" autocomplete="off">
        </div>
        <button id="drawBtn">🎲 确认信息并抽签</button>
        <div id="resultArea"></div>
        <div class="small-note">※ 每人仅可抽取一次，手机号作为唯一标识</div>
    </div>

    <!-- 管理员区域（需密码2132） -->
    <div class="card admin-area">
        <div class="admin-header">
            <span>🔐 管理员区域 <span id="loginStatus" class="status-badge">未登录</span></span>
        </div>
        <div class="password-input-group">
            <input type="password" id="adminPassword" placeholder="请输入管理员密码" autocomplete="off">
            <button id="loginBtn">登录</button>
        </div>
        <div id="adminPanel" class="admin-panel">
            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center;">
                <button id="exportExcelBtn" class="btn-outline export-btn">📎 导出抽考信息 (Excel)</button>
                <button id="resetAllBtn" class="btn-outline" style="border-color:#c97e0a; color:#b1590a;">⚠️ 重置全部数据</button>
            </div>
            <div id="adminMsg" style="font-size:0.8rem; margin-top:12px; color:#2c7da0;"></div>
            <div class="small-note" style="text-align:left; margin-top:8px;">✅ 导出字段：科室、姓名、工号、手机号、考号、考试项目、组别、抽签时间</div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 固定72人均衡抽签算法
    // 项目配额：吸痰17、静脉输液14、吸氧23、生命体征19
    // 分组：1-7组每组10人，第8组2人
    // ============================================================
    function buildBalancedExamMap() {
        const groupSizes = [10,10,10,10,10,10,10,2];
        let totalItems = [];
        for(let i=0;i<17;i++) totalItems.push("吸痰");
        for(let i=0;i<14;i++) totalItems.push("静脉输液");
        for(let i=0;i<23;i++) totalItems.push("吸氧");
        for(let i=0;i<19;i++) totalItems.push("生命体征");
        
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        let shuffledPool = shuffle([...totalItems]);
        let assignment = new Array(72);
        let idx = 0;
        let groupBoundaries = [];
        let start = 0;
        for(let g=0; g<groupSizes.length; g++) {
            let end = start + groupSizes[g];
            groupBoundaries.push({start, end, size: groupSizes[g]});
            for(let i=start; i<end; i++) {
                assignment[i] = shuffledPool[idx++];
            }
            start = end;
        }
        
        // 组内均衡交换优化
        function optimizeGroupBalance(arr, groups) {
            let groupStats = groups.map(g => {
                let sub = arr.slice(g.start, g.end);
                let cnt = {xt:0, sy:0, xy:0, sm:0};
                sub.forEach(v => {
                    if(v==='吸痰') cnt.xt++;
                    else if(v==='静脉输液') cnt.sy++;
                    else if(v==='吸氧') cnt.xy++;
                    else if(v==='生命体征') cnt.sm++;
                });
                return {...cnt, start: g.start, end: g.end, size: g.size};
            });
            
            const totalGroups = groups.length;
            const targetAvg = {
                xt: 17 / totalGroups,
                sy: 14 / totalGroups,
                xy: 23 / totalGroups,
                sm: 19 / totalGroups
            };
            
            function getTypeKey(proj) {
                if(proj === '吸痰') return 'xt';
                if(proj === '静脉输液') return 'sy';
                if(proj === '吸氧') return 'xy';
                return 'sm';
            }
            function updateCount(stat, proj, delta) {
                if(proj === '吸痰') stat.xt += delta;
                else if(proj === '静脉输液') stat.sy += delta;
                else if(proj === '吸氧') stat.xy += delta;
                else if(proj === '生命体征') stat.sm += delta;
            }
            function getScore(cnt, type) {
                let target = targetAvg[type];
                let val = cnt[type];
                return Math.abs(val - target);
            }
            
            for(let iter=0; iter<300; iter++) {
                let g1 = Math.floor(Math.random() * totalGroups);
                let g2 = Math.floor(Math.random() * totalGroups);
                if(g1 === g2) continue;
                let pos1 = Math.floor(Math.random() * groupStats[g1].size) + groupStats[g1].start;
                let pos2 = Math.floor(Math.random() * groupStats[g2].size) + groupStats[g2].start;
                let v1 = arr[pos1];
                let v2 = arr[pos2];
                if(v1 === v2) continue;
                
                let oldScore = getScore(groupStats[g1], getTypeKey(v1)) + getScore(groupStats[g1], getTypeKey(v2)) +
                               getScore(groupStats[g2], getTypeKey(v1)) + getScore(groupStats[g2], getTypeKey(v2));
                let newStats1 = {...groupStats[g1]};
                let newStats2 = {...groupStats[g2]};
                updateCount(newStats1, v1, -1);
                updateCount(newStats1, v2, 1);
                updateCount(newStats2, v2, -1);
                updateCount(newStats2, v1, 1);
                let newScore = getScore(newStats1, getTypeKey(v1)) + getScore(newStats1, getTypeKey(v2)) +
                               getScore(newStats2, getTypeKey(v1)) + getScore(newStats2, getTypeKey(v2));
                if(newScore < oldScore) {
                    [arr[pos1], arr[pos2]] = [arr[pos2], arr[pos1]];
                    groupStats[g1] = newStats1;
                    groupStats[g2] = newStats2;
                }
            }
            return arr;
        }
        
        return optimizeGroupBalance(assignment, groupBoundaries);
    }
    
    let examMap = null;
    function initExamMap() {
        if(!examMap) examMap = buildBalancedExamMap();
        return examMap;
    }
    
    function getGroupByNumber(num) {
        if(num <= 10) return 1;
        if(num <= 20) return 2;
        if(num <= 30) return 3;
        if(num <= 40) return 4;
        if(num <= 50) return 5;
        if(num <= 60) return 6;
        if(num <= 70) return 7;
        return 8;
    }
    
    async function getNextAvailableNumber(drawnSet) {
        for(let i=1; i<=72; i++) {
            if(!drawnSet.has(i)) return i;
        }
        return null;
    }
    
    // ============================================================
    // IndexedDB 存储
    // ============================================================
    const DB_NAME = 'NurseDrawDB_v5';
    const STORE_NAME = 'records';
    let db = null;
    
    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const dbRef = event.target.result;
                if(!dbRef.objectStoreNames.contains(STORE_NAME)) {
                    const store = dbRef.createObjectStore(STORE_NAME, { keyPath: 'phone' });
                    store.createIndex('drawTime', 'drawTime');
                }
            };
        });
    }
    
    async function ensureDB() {
        if(db) return db;
        return await openDB();
    }
    
    async function getAllRecords() {
        await ensureDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
        });
    }
    
    async function saveRecord(record) {
        await ensureDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const request = store.put(record);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }
    
    async function deleteAllRecords() {
        await ensureDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const request = store.clear();
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }
    
    async function getDrawnNumbers() {
        const records = await getAllRecords();
        const set = new Set();
        records.forEach(r => { if(r.number) set.add(r.number); });
        return set;
    }
    
    // ============================================================
    // 抽签核心逻辑
    // ============================================================
    async function performDraw(dept, name, jobNo, phone) {
        if(!dept || !name || !jobNo || !phone) {
            return { success: false, msg: '请填写科室、姓名、工号和手机号' };
        }
        if(!/^1[3-9]\d{9}$/.test(phone)) {
            return { success: false, msg: '请输入正确的11位手机号' };
        }
        await ensureDB();
        const existing = await getAllRecords();
        if(existing.find(r => r.phone === phone)) {
            return { success: false, msg: '该手机号已完成抽签，不可重复抽取' };
        }
        const drawnNumbers = await getDrawnNumbers();
        const availableNumber = await getNextAvailableNumber(drawnNumbers);
        if(availableNumber === null) {
            return { success: false, msg: '抱歉，所有考号已满（72人已满）' };
        }
        const map = initExamMap();
        const project = map[availableNumber-1];
        const group = getGroupByNumber(availableNumber);
        const record = {
            dept, name, jobNo, phone,
            number: availableNumber,
            project, group,
            drawTime: new Date().toISOString()
        };
        await saveRecord(record);
        return { success: true, record };
    }
    
    function displayResult(record) {
        const container = document.getElementById('resultArea');
        let badgeClass = '';
        if(record.project === '吸痰') badgeClass = 'project-xitan';
        else if(record.project === '静脉输液') badgeClass = 'project-shuye';
        else if(record.project === '吸氧') badgeClass = 'project-xiyang';
        else badgeClass = 'project-shengming';
        container.innerHTML = `
            <div class="result-box">
                <div style="font-weight:bold;">✅ 抽签成功</div>
                <div>👤 ${record.name} | ${record.dept} | 工号:${record.jobNo}</div>
                <div>📌 考号: ${record.number} 号 (第${record.group}组)</div>
                <div class="project-badge ${badgeClass}">📋 ${record.project}</div>
                <div style="margin-top:8px;">请凭此项目参加考试</div>
            </div>
        `;
    }
    
    // ============================================================
    // 导出Excel
    // ============================================================
    async function exportToExcel() {
        const records = await getAllRecords();
        if(records.length === 0) {
            alert('暂无抽签数据');
            return;
        }
        records.sort((a,b) => (a.number||0) - (b.number||0));
        const rows = records.map(r => ({
            '科室': r.dept,
            '姓名': r.name,
            '工号': r.jobNo,
            '手机号': r.phone,
            '考号': r.number,
            '考试项目': r.project,
            '组别': r.group,
            '抽签时间': new Date(r.drawTime).toLocaleString()
        }));
        if(typeof XLSX === 'undefined') {
            const script = document.createElement('script');
            script.src = 'https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';
            script.onload = () => generateExcel(rows);
            document.head.appendChild(script);
        } else {
            generateExcel(rows);
        }
    }
    
    function generateExcel(data) {
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '抽签记录');
        XLSX.writeFile(wb, `护理抽签_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.xlsx`);
        document.getElementById('adminMsg').innerHTML = '✅ 导出成功！';
        setTimeout(() => { if(document.getElementById('adminMsg')) document.getElementById('adminMsg').innerHTML = ''; }, 2000);
    }
    
    async function resetAllData() {
        if(confirm('⚠️ 此操作会删除所有考生的抽签记录，考号将重新释放。确定要重置吗？')) {
            await deleteAllRecords();
            document.getElementById('resultArea').innerHTML = '';
            document.getElementById('adminMsg').innerHTML = '✅ 所有数据已清空，可重新抽签';
            setTimeout(() => {
                if(document.getElementById('adminMsg')) document.getElementById('adminMsg').innerHTML = '';
            }, 3000);
        }
    }
    
    // ============================================================
    // 管理员登录逻辑
    // ============================================================
    let adminLoggedIn = false;
    const ADMIN_PASSWORD = "2132";
    
    function updateAdminUI() {
        const panel = document.getElementById('adminPanel');
        const statusSpan = document.getElementById('loginStatus');
        if(adminLoggedIn) {
            panel.classList.add('show');
            statusSpan.innerText = '已登录';
            statusSpan.classList.add('logged');
        } else {
            panel.classList.remove('show');
            statusSpan.innerText = '未登录';
            statusSpan.classList.remove('logged');
        }
    }
    
    // ============================================================
    // 事件绑定与初始化
    // ============================================================
    window.addEventListener('DOMContentLoaded', async () => {
        await ensureDB();
        initExamMap();
        
        document.getElementById('drawBtn').addEventListener('click', async () => {
            const dept = document.getElementById('dept').value.trim();
            const name = document.getElementById('name').value.trim();
            const jobNo = document.getElementById('jobNo').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const result = await performDraw(dept, name, jobNo, phone);
            if(result.success) {
                displayResult(result.record);
                document.getElementById('dept').value = '';
                document.getElementById('name').value = '';
                document.getElementById('jobNo').value = '';
                document.getElementById('phone').value = '';
            } else {
                document.getElementById('resultArea').innerHTML = `<div class="result-box" style="color:#c23d3d;">❌ ${result.msg}</div>`;
            }
        });
        
        document.getElementById('loginBtn').addEventListener('click', () => {
            const pwd = document.getElementById('adminPassword').value;
            if(pwd === ADMIN_PASSWORD) {
                adminLoggedIn = true;
                updateAdminUI();
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminMsg').innerHTML = '✅ 登录成功，可导出数据或重置';
                setTimeout(() => {
                    if(document.getElementById('adminMsg')) document.getElementById('adminMsg').innerHTML = '';
                }, 2000);
            } else {
                alert('密码错误，无权导出数据');
                document.getElementById('adminPassword').value = '';
            }
        });
        
        document.getElementById('exportExcelBtn').addEventListener('click', async () => {
            if(!adminLoggedIn) {
                alert('请先输入管理员密码登录');
                return;
            }
            await exportToExcel();
        });
        
        document.getElementById('resetAllBtn').addEventListener('click', async () => {
            if(!adminLoggedIn) {
                alert('请先输入管理员密码登录');
                return;
            }
            await resetAllData();
        });
        
        updateAdminUI();
    });
</script>
</body>
</html>
